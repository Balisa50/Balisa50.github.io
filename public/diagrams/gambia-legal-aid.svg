<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1028 190" width="1028" height="190" role="img" aria-label="A retrieval pipeline with a validator after the model rather than before it, because the failure worth catching is an invented citation."><style>.dgm-node { font: 12px var(--font-inter, ui-sans-serif, system-ui, sans-serif); fill: var(--dgm-ink, #1c1917); } .dgm-layer { font: 10px var(--font-geist-mono, ui-monospace, monospace); letter-spacing: 0.11em; fill: var(--dgm-faint, #a8a29e); } .dgm-edge { font: 9.5px var(--font-geist-mono, ui-monospace, monospace); fill: var(--dgm-faint, #78716c); }</style><defs><marker id="dgm-arrow-gambia-legal-aid" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 7 4 L 0 7 z" fill="var(--dgm-rule, #d6d3d1)"/></marker></defs><text x="20" y="32" class="dgm-layer">CORPUS</text><text x="192" y="32" class="dgm-layer">INDEX</text><text x="369" y="32" class="dgm-layer">STORE</text><text x="541" y="32" class="dgm-layer">ANSWER</text><text x="718" y="32" class="dgm-layer">GUARD</text><text x="890" y="32" class="dgm-layer">SURFACE</text><path d="M 138 108 C 162.3 108, 167.7 108, 192 108" fill="none" stroke="var(--dgm-rule, #d6d3d1)" stroke-width="1" marker-end="url(#dgm-arrow-gambia-legal-aid)"/><path d="M 315 108 C 339.3 108, 344.7 108, 369 108" fill="none" stroke="var(--dgm-rule, #d6d3d1)" stroke-width="1" marker-end="url(#dgm-arrow-gambia-legal-aid)"/><path d="M 487 108 C 511.3 108, 516.7 65.5, 541 65.5" fill="none" stroke="var(--dgm-rule, #d6d3d1)" stroke-width="1" marker-end="url(#dgm-arrow-gambia-legal-aid)"/><path d="M 664 65.5 C 688 65.5, 519.5 135.5, 543.5 135.5" fill="none" stroke="var(--dgm-rule, #d6d3d1)" stroke-width="1" marker-end="url(#dgm-arrow-gambia-legal-aid)"/><path d="M 661.5 135.5 C 686.925 135.5, 692.575 73, 718 73" fill="none" stroke="var(--dgm-rule, #d6d3d1)" stroke-width="1" marker-end="url(#dgm-arrow-gambia-legal-aid)"/><path d="M 487 108 C 590.9