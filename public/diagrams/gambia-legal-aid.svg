.5" y="139" text-anchor="middle" class="dgm-node">fallback</text><text x="602.5" y="154" text-anchor="middle" class="dgm-node">provider</text><rect x="718" y="46" width="118" height="54" rx="3" fill="var(--dgm-bg, #ffffff)" stroke="var(--dgm-rule, #d6d3d1)" stroke-width="1"/><text x="777" y="69" text-anchor="middle" class="dgm-node">Citation</text><text x="777" y="84" text-anchor="middle" class="dgm-node">validator</text><rect x="718" y="116" width="118" height="54" rx="3" fill="var(--dgm-bg, #ffffff)" stroke="var(--dgm-rule, #d6d3d1)" stroke-width="1"/><text x="777" y="139" text-anchor="middle" class="dgm-node">Refuse if the</text><text x="777" y="154" text-anchor="middle" class="dgm-node">store is down</text><rect x="890" y="88.5" width="118" height="39" rx="3" fill="var(--dgm-surface, #f4f4f2)" stroke="var(--dgm-ink, #0c0a09)" stroke-width="1"/><text x="949" y="111.5" text-anchor="middle" class="dgm-node">Next.js chat</text></svg>