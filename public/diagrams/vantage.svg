<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 846 190" width="846" height="190" role="img" aria-label="Nobody is in the loop. That is the feature, and it is also where a dead region collector hid for weeks."><style>.dgm-node { font: 12px var(--font-inter, ui-sans-serif, system-ui, sans-serif); fill: var(--dgm-ink, #1c1917); } .dgm-layer { font: 10px var(--font-geist-mono, ui-monospace, monospace); letter-spacing: 0.11em; fill: var(--dgm-faint, #a8a29e); } .dgm-edge { font: 9.5px var(--font-geist-mono, ui-monospace, monospace); fill: var(--dgm-faint, #78716c); }</style><defs><marker id="dgm-arrow-vantage" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 7 4 L 0 7 z" fill="var(--dgm-rule, #d6d3d1)"/></marker></defs><text x="20" y="32" class="dgm-layer">TRIGGER</text><text x="192" y="32" class="dgm-layer">COLLECT</text><text x="364" y="32" class="dgm-layer">WRITE</text><text x="536" y="32" class="dgm-layer">STORE</text><text x="708" y="32" class="dgm-layer">SURFACE</text><path d="M 138 108 C 162.3 108, 167.7 108, 192 108" fill="none" stroke="var(--dgm-rule, #d6d3d1)" stroke-width="1" marker-end="url(#dgm-arrow-vantage)"/><path d="M 310 108 C 334.3 108, 339.7 73, 364 73" fill="none" stroke="var(--dgm-rule, #d6d3d1)" stroke-width="1" marker-end="url(#dgm-arrow-vantage)"/><path d="M 364 73 C 324 196, 522 196, 482 143" fill="none" stroke="var(--dgm-rule, #d6d3d1)" stroke-width="1" marker-end="url(#dgm-arrow-vantage)"/><path d="M 482 143 C 506.3 143, 511.7 108, 536 108" fill="none" stroke="var(--dgm-rule, #d6d3d1)" stroke-width="1" marker-end="url(#dgm-arrow-vantage)"/><path d="M 654 108 C 678.3 108, 683.7 108, 708 108" fill="none" stroke="var(--dgm-rule, #d6d3d1)" stroke-width="1" marker-end="url(#dgm-arrow-vantage)"/><rect x="20" y="81" width="118" height="54" rx="3" fill="none" stroke="var(--dgm-rule, #d6d3d1)" stroke-width="1" stroke-dasharray="4 3"/><text x="79" y="104" text-anchor="middle" class="