<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 857 190" width="857" height="190" role="img" aria-label="Two generation paths, one validation gate. Copy mode learns a dataset you have; create mode builds one you do not."><style>.dgm-node { font: 12px var(--font-inter, ui-sans-serif, system-ui, sans-serif); fill: var(--dgm-ink, #1c1917); } .dgm-layer { font: 10px var(--font-geist-mono, ui-monospace, monospace); letter-spacing: 0.11em; fill: var(--dgm-faint, #a8a29e); } .dgm-edge { font: 9.5px var(--font-geist-mono, ui-monospace, monospace); fill: var(--dgm-faint, #78716c); }</style><defs><marker id="dgm-arrow-nova" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 7 4 L 0 7 z" fill="var(--dgm-rule, #d6d3d1)"/></marker></defs><text x="20" y="32" class="dgm-layer">INPUT</text><text x="192" y="32" class="dgm-layer">GUARD</text><text x="364" y="32" class="dgm-layer">GENERATE</text><text x="547" y="32" class="dgm-layer">VALIDATE</text><text x="719" y="32" class="dgm-layer">SERVE</text><path d="M 138 65.5 C 242.175 65.5, 265.325 73, 369.5 73" fill="none" stroke="var(--dgm-rule, #d6d3d1)" stroke-width="1" marker-end="url(#dgm-arrow-nova)"/><rect x="238.95" y="53.25" width="29.6" height="13" fill="var(--dgm-bg, #ffffff)"/><text x="253.75" y="63.25" text-anchor="middle" class="dgm-edge">copy</text><path d="M 138 135.5 C 162.3 135.5, 167.7 108, 192 108" fill="none" stroke="var(--dgm-rule, #d6d3d1)" stroke-width="1" marker-end="url(#dgm-arrow-nova)"/><path d="M 310 108 C 334.3 108, 339.7 143, 364 143" fill="none" stroke="var(--dgm-rule, #d6d3d1)" stroke-width="1" marker-end="url(#dgm-arrow-nova)"/><rect x="316.8" y="109.5" width="40.400000000000006" height="13" fill="var(--dgm-bg, #ffffff)"/><text x="337" y="119.5" text-anchor="middle" class="dgm-edge">create</text><path d="M 487.5 73 C 514.275 73, 520.225 108, 547 108" fill="none" stroke="var(--dgm-rule, #d6d3d1)" stroke-width="1" marker-end="url(#dgm-arrow-nova)"/><rect x="461.95" y="74.5" width="110.60000000000001" height="13" fill="var(--dgm-bg, #ffffff)"/><text x="517.25" y="84.5" text-anchor="middle" class="dgm-edge">identities repaired</text><path d="M 493 143 C 517.3 143, 522.7 108, 547 108" fill="none" stroke="var(--dgm-rule, #d6d3d1)" stroke-width="1" marker-end="url(#dgm-arrow-nova)"/><path d="M 665 108 C 689.3 108, 694.7 80.5, 719 80.5" fill="none" stroke="var(--dgm-rule, #d6d3d1)" stroke-width="1" marker-end="url(#dgm-arrow-nova)"/><path d="M 719 80.5 C 679 188.5, 877 188.5, 837 143" fill="none" stroke="var(--dgm-rule, #d6d3d1)" stroke-width="1" marker-end="url(#dgm-arrow-nova)"/><rect x="20" y="46" width="118" height="39" rx="3" fill="none" stroke="var(--dgm-rule, #d6d3d1)" stroke-width="1" stroke-dasharray="4 3"/><text x="79" y="69" text-anchor="middle" class="dgm-node">CSV you upload</text><rect x="20" y="101" width="118" height="69" rx="3" fill="none" stroke="var(--dgm-rule, #d6d3d1)" stroke-width="1" stroke-dasharray="4 3"/><text x="79" y="124" text-anchor="middle" class="dgm-node">Columns,</text><text x="79" y="139" text-anchor="middle" class="dgm-node">distributions,</text><text x="79" y="154" text-anchor="middle" class="dgm-node">rules</text><rect x="192" y="73.5" width="118" height="69" rx="3" fill="var(--dgm-bg, #ffffff)" stroke="var(--dgm-rule, #d6d3d1)" stroke-width="1"/><text x="251" y="96.5" text-anchor="middle" class="dgm-node">Whitelist</text><text x="251" y="111.5" text-anchor="middle" class="dgm-node">expression</text><text x="251" y="126.5" text-anchor="middle" class="dgm-node">evaluator</text><rect x="369.5" y="46" width="118" height="54" rx="3" fill="var(--dgm-bg, #ffffff)" stroke="var(--dgm-accent, #1d4ed8)" stroke-width="1"/><rect x="369.5" y="46" width="3" height="54" fill="var(--dgm-accent, #1d4ed8)"/><text x="428.5" y="69" text-anchor="middle" class="dgm-node">CTGAN, written</text><text x="428.5" y="84" text-anchor="middle" class="dgm-node">from the paper</text><rect x="364" y="116"