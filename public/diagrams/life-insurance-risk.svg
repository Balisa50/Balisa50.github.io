<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 868 230" width="868" height="230" role="img" aria-label="Three survival methods price one book, and the stress test is what decides whether the price holds."><style>.dgm-node { font: 12px var(--font-inter, ui-sans-serif, system-ui, sans-serif); fill: var(--dgm-ink, #1c1917); } .dgm-layer { font: 10px var(--font-geist-mono, ui-monospace, monospace); letter-spacing: 0.11em; fill: var(--dgm-faint, #a8a29e); } .dgm-edge { font: 9.5px var(--font-geist-mono, ui-monospace, monospace); fill: var(--dgm-faint, #78716c); }</style><defs><marker id="dgm-arrow-life-insurance-risk" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 7 4 L 0 7 z" fill="var(--dgm-rule, #d6d3d1)"/></marker></defs><text x="20" y="32" class="dgm-layer">DATA</text><text x="192" y="32" class="dgm-layer">FIT</text><text x="375" y="32" class="dgm-layer">PRICE</text><text x="547" y="32" class="dgm-layer">RISK</text><text x="730" y="32" class="dgm-layer">SURFACE</text><path d="M 138 128 C 162.3 128, 167.7 65.5, 192 65.5" fill="none" stroke="var(--dgm-rule, #d6d3d1)" stroke-width="1" marker-end="url(#dgm-arrow-life-insurance-risk)"/><path d="M 138 128 C 164.775 128, 170.725 120.5, 197.5 120.5" fill="none" stroke="var(--dgm-rule, #d6d3d1)" stroke-width="1" marker-end="url(#dgm-arrow-life-insurance-risk)"/><path d="M 138 128 C 163.65 128, 169.35 183, 195 183" fill="none" stroke="var(--dgm-rule, #d6d3d1)" stroke-width="1" marker-end="url(#dgm-arrow-life-insurance-risk)"/><path d="M 321 65.5 C 345.3 65.5, 350.7 128, 375 128" fill="none" stroke="var(--dgm-rule, #d6d3d1)" stroke-width="1" marker-end="url(#dgm-arrow-life-insurance-risk)"/><path d="M 315.5 120.5 C 342.275 120.5, 348.225 128, 375 128" fill="none" stroke="var(--dgm-rule, #d6d3d1)" stroke-width="1" marker-end="url(#dgm-arrow-life-insurance-risk)"/><path d="M 318 183 C 343.65 183, 349.35 128, 375 128" fill="none" stroke="var(--dgm-rule, #d6d