<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1265 285" width="1265" height="285" role="img" aria-label="Everything expensive happens once, at build time. The browser holds the vectors, so a query costs nothing to serve. The only part that needs a provider is the commentary, and that walks a chain rather than trusting one host."><style>.dgm-node { font: 12px var(--font-inter, ui-sans-serif, system-ui, sans-serif); fill: var(--dgm-ink, #1c1917); } .dgm-layer { font: 10px var(--font-geist-mono, ui-monospace, monospace); letter-spacing: 0.11em; fill: var(--dgm-faint, #a8a29e); } .dgm-edge { font: 9.5px var(--font-geist-mono, ui-monospace, monospace); fill: var(--dgm-faint, #78716c); }</style><defs><marker id="dgm-arrow-ayat" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 7 4 L 0 7 z" fill="var(--dgm-rule, #d6d3d1)"/></marker></defs><text x="20" y="32" class="dgm-layer">CORPUS</text><text x="192" y="32" class="dgm-layer">EMBED</text><text x="407" y="32" class="dgm-layer">REDUCE</text><text x="579" y="32" class="dgm-layer">SHIP</text><text x="756" y="32" class="dgm-layer">BROWSER</text><text x="939" y="32" class="dgm-layer">COMMENTARY</text><text x="1116" y="32" class="dgm-layer">PROVIDERS</text><path d="M 138 155.5 C 162.3 155.5, 167.7 155.5, 192 155.5" fill="none" stroke="var(--dgm-rule, #d6d3d1)" stroke-width="1" marker-end="url(#dgm-arrow-ayat)"/><path d="M 353 155.5 C 377.3 155.5, 382.7 155.5, 407 155.5" fill="none" stroke="var(--dgm-rule, #d6d3d1)" stroke-width="1" marker-end="url(#dgm-arrow-ayat)"/><path d="M 525 155.5 C 549.3 155.5, 554.7 155.5, 579 155.5" fill="none" stroke="var(--dgm-rule, #d6d3d1)" stroke-width="1" marker-end="url(#dgm-arrow-ayat)"/><path d="M 702 155.5 C 726.3 155.5, 731.7 190.5, 756 190.5" fill="none" stroke="var(--dgm-rule, #d6d3d1)" stroke-width="1" marker-end="url(#dgm-arrow-ayat)"/><path d="M 702 155.5 C 727.65 155.5, 733.35 120.5, 759 120.5" fill="none" stroke="va