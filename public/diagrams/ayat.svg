<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1082 190" width="1082" height="190" role="img" aria-label="Everything expensive happens once, at build time. The browser holds the vectors, so a query costs nothing to serve."><style>.dgm-node { font: 12px var(--font-inter, ui-sans-serif, system-ui, sans-serif); fill: var(--dgm-ink, #1c1917); } .dgm-layer { font: 10px var(--font-geist-mono, ui-monospace, monospace); letter-spacing: 0.11em; fill: var(--dgm-faint, #a8a29e); } .dgm-edge { font: 9.5px var(--font-geist-mono, ui-monospace, monospace); fill: var(--dgm-faint, #78716c); }</style><defs><marker id="dgm-arrow-ayat" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 7 4 L 0 7 z" fill="var(--dgm-rule, #d6d3d1)"/></marker></defs><text x="20" y="32" class="dgm-layer">CORPUS</text><text x="192" y="32" class="dgm-layer">EMBED</text><text x="407" y="32" class="dgm-layer">REDUCE</text><text x="579" y="32" class="dgm-layer">SHIP</text><text x="756" y="32" class="dgm-layer">BROWSER</text><text x="939" y="32" class="dgm-layer">ANSWER</text><path d="M 138 108 C 162.3 108, 167.7 108, 192 108" fill="none" stroke="var(--dgm-rule, #d6d3d1)" stroke-width="1" marker-end="url(#dgm-arrow-ayat)"/><path d="M 353 108 C 377.3 108, 382.7 108, 407 108" fill="none" stroke="var(--dgm-rule, #d6d3d1)" stroke-width="1" marker-end="url(#dgm-arrow-ayat)"/><path d="M 525 108 C 549.3 108, 554.7 108, 579 108" fill="none" stroke="var(--dgm-rule, #d6d3d1)" stroke-width="1" marker-end="url(#dgm-arrow-ayat)"/><path d="M 702 108 C 726.3 108, 731.7 143, 756 143" fill="none" stroke="var(--dgm-rule, #d6d3d1)" stroke-width="1" marker-end="url(#dgm-arrow-ayat)"/><path d="M 702 108 C 727.65 108, 733.35 73, 759 73" fill="none" stroke="var(--dgm-rule, #d6d3d1)" stroke-width="1" marker-end="url(#dgm-arrow-ayat)"/><path d="M 759 73 C 719 196, 925 196, 885 143" fill="none" stroke="var(--dgm-rule, #d6d3d1)" stroke-width="1" marker-end="url(#dgm-arrow-ayat)"/><rect x="777.5" y="193" width="89" height="13" fill="var(--dgm-bg, #ffffff)"/><text x="822" y="203" text-anchor="middle" class="dgm-edge">axis of meaning</text><path d="M 882 73 C 907.65 73, 913.35 108, 939 108" fill="none" stroke="var(--dgm-rule, #d6d3d1)" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#dgm-arrow-ayat)"/><rect x="20" y="88.5" width="118" height="39" rx="3" fill="none" stroke="var(--dgm-rule, #d6d3d1)" stroke-width="1" stroke-dasharray="4 3"/><text x="79" y="111.5" text-anchor="middle" class="dgm-node">6,236 verses</text><rect x="192" y="88.5" width="161" height="39" rx="3" fill="var(--dgm-bg, #ffffff)" stroke="var(--dgm-accent, #1d4ed8)" stroke-width="1"/><rect x="192" y="88.5" width="3" height="39" fill="var(--dgm-accent, #1d4ed8)"/><text x="272.5" y="111.5" text-anchor="middle" class="dgm-node">sentence-transformers</text><rect x="407" y="81" width="118" height="54" rx="3" fill="var(--dgm-bg, #ffffff)" stroke="var(--dgm-accent, #1d4ed8)" stroke-width="1"/><rect x="407" y="81" width="3" height="54" fill="var(--dgm-accent, #1d4ed8)"/><text x="466" y="104" text-anchor="middle" class="dgm-node">UMAP to 3D,</text><text x="466" y="119" text-anchor="middle" class="dgm-node">HDBSCAN</text><rect x="579" y="81" width="123" height="54" rx="3" fill="var(--dgm-surface, #f4f4f2)" stroke="var(--dgm-rule, #d6d3d1)" stroke-width="1"/><text x="640.5" y="104" text-anchor="middle" class="dgm-node">Coordinates and</text><text x="640.5" y="119" text-anchor="middle" class="dgm-node">vectors</text><rect x="759" y="46" width="123" height="54" rx="3" fill="var(--dgm-bg, #ffffff)" stroke="var(--dgm-accent, #1d4ed8)" stroke-width="1"/><rect x="759" y="46" width="3" height="54" fill="var(--dgm-accent, #1d4ed8)"/><text x="820.5" y="69" text-anchor="middle" class="dgm-node">transformers.js</text><text x="820.5" y="84" text-anchor="middle" class="dgm-node">query embedding</text><rect x="756" y="116" width="129" height="54" rx="3" fill="var(--dgm-surface, #f4f4f2)" stroke="var(--dgm-ink, #0c0a09)" stroke-width="1"/><text x="820.5" y="139" text-anchor="middle" class="dgm-node">Three.js Points,</text><text x="820.5" y="154" text-anchor="middle" class="dgm-node">one draw call</text><rect x="939" y="81" width="123" height="54" rx="3" fill="none" stroke="var(--dgm-faint, #a8a29e)" stroke-width="1" stroke-dasharray="2 3"/><text x="1000.5" y="104" text-anchor="middle" class="dgm-node">LLM, or it says</text><text x="1000.5" y="119" text-anchor="middle" class="dgm-node">it has nothing</text></svg>