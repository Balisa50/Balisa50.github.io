ule, #d6d3d1)" stroke-width="1"/><text x="812.5" y="139" text-anchor="middle" class="dgm-node">Rebuild WPP from</text><text x="812.5" y="154" text-anchor="middle" class="dgm-node">its own inputs</text><rect x="931" y="116" width="118" height="54" rx="3" fill="var(--dgm-surface, #f4f4f2)" stroke="var(--dgm-ink, #0c0a09)" stroke-width="1"/><text x="990" y="139" text-anchor="middle" class="dgm-node">Report, policy</text><text x="990" y="154" text-anchor="middle" class="dgm-node">brief, figures</text></svg>