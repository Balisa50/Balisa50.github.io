# What the droplet runs.
#
# Coolify installs and manages its own containers (the dashboard and a Traefik
# proxy) outside this file, and it can build the portfolio service from the
# Dockerfile on a git push. This file exists for two reasons: it documents the
# whole box in one place, and it is the escape hatch. If Coolify is ever the
# problem rather than the solution, `docker compose -f deploy/docker-compose.prod.yml up -d`
# brings the same stack up without it.
#
#   scp this file and .env to the droplet, or let Coolify read it from the repo
#   docker compose -f deploy/docker-compose.prod.yml up -d

services:
  portfolio:
    build:
      context: ..
      dockerfile: Dockerfile
    image: balisa-portfolio:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      # Optional. When Uptime Kuma has history, the infra page reads real
      # uptime from it instead of reporting reachability only.
      UPTIME_KUMA_URL: ${UPTIME_KUMA_URL:-}
    expose:
      - "3000"
    # No published port. Traefik is the only thing that should reach it.
    networks:
      - edge
    labels:
      traefik.enable: "true"
      traefik.http.routers.portfolio.rule: Host(`${SITE_HOST:-localhost}`)
      traefik.http.routers.portfolio.entrypoints: websecure
      traefik.http.routers.portfolio.tls.certresolver: letsencrypt
      traefik.http.services.portfolio.loadbalancer.server.port: "3000"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          # Generous for a Next.js server serving static output, and low enough
          # that a leak takes down one container instead of the box.
          memory: 384M

  uptime-kuma:
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    volumes:
      - kuma_data:/app/data
    expose:
      - "3001"
    networks:
      - edge
    labels:
      traefik.enable: "true"
      traefik.http.routers.kuma.rule: Host(`status.${SITE_HOST:-localhost}`)
      traefik.http.routers.kuma.entrypoints: websecure
      traefik.http.routers.kuma.tls.certresolver: letsencrypt
      traefik.http.services.kuma.loadbalancer.server.port: "3001"
    deploy:
      resources:
        limits:
          memory: 192M

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    volumes:
      - pg_data:/var/lib/postgresql/data
    # Deliberately not on the edge network and deliberately not published.
    # Nothing outside the box has any business reaching this.
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app}"]
      interval: 20s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  # Not started by default. `docker compose --profile apps up -d` brings it up.
  # The portfolio does not use a cache and adding one it does not need would be
  # infrastructure theatre. It is here because the projects that are next onto
  # this box do, and because the point of a shared server is that the second
  # service is nearly free.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    profiles: ["apps"]
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no", "--maxmemory", "96mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 20s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M

networks:
  edge:
    # Created by Coolify when it installs Traefik. If you are running this
    # without Coolify, drop `external: true` and compose will make it.
    external: true
    name: coolify
  internal:
    driver: bridge

volumes:
  kuma_data:
  pg_data:
  redis_data:
