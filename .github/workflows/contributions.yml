name: Refresh contributions

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch
        run: |
          mkdir -p public/data
          curl -fsSL "https://github-contributions-api.jogruber.de/v4/Balisa50?y=last" -o public/data/contributions.json
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/contributions.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh contribution data"
          git push
