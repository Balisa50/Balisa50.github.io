# Local development with hot reload.
#
#   docker compose up
#
# This is not the production image. It mounts the repository into a plain node
# container and runs `next dev`, so an edit on the host reloads in the browser.
# The production build is the Dockerfile, and deploy/docker-compose.prod.yml is
# what the droplet runs.
#
# The point of having this at all is that "it works on my machine" is a Windows
# machine, and the droplet is Ubuntu. Building and running here first catches
# the case-sensitivity and line-ending problems before they reach the server.

services:
  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0 --port 3000"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      # Named volumes so the container keeps its own Linux-built node_modules
      # and .next rather than fighting with whatever the Windows host has in
      # those directories. Bind-mounting node_modules across platforms is the
      # single most reliable way to get a broken dev container.
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      # Bind mounts on Windows and macOS do not deliver inotify events into the
      # container, so the watcher has to poll.
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"

volumes:
  node_modules:
  next_cache:
